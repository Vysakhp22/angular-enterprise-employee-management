@if (toasts().length > 0) {
  <div class="toast toast-top toast-end z-9999">
    @for (toast of toasts(); track toast.id) {
      <div [class]="alertClass(toast.type)">
        <span class="flex-1">{{ toast.message }}</span>
        <button
          class="btn btn-ghost btn-xs"
          (click)="dismiss(toast.id)"
          aria-label="Dismiss"
        >✕</button>
      </div>
    }
  </div>
}
