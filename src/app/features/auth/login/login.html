<div class="min-h-screen bg-base-200 flex items-center justify-center px-4">
    <div class="card bg-base-100 w-full max-w-sm shadow-lg">
        <div class="card-body gap-1 px-8 py-10">

            <h2 class="text-2xl font-bold text-base-content">Welcome back</h2>
            <p class="text-sm text-base-content/50 mb-6">Sign in to your account</p>

            <form class="flex flex-col gap-5">
                <div class="form-control">
                    <label class="label pb-1" for="email">
                        <span class="label-text font-medium">Email</span>
                    </label>
                    <input type="email" id="email" placeholder="you@example.com" class="input input-bordered w-full"
                        required autocomplete="email" />
                </div>

                <div class="form-control">
                    <label class="label pb-1" for="password">
                        <span class="label-text font-medium">Password</span>
                        <a class="label-text-alt link link-hover text-base-content/50">Forgot password?</a>
                    </label>
                    <input type="password" id="password" placeholder="••••••••" class="input input-bordered w-full"
                        required autocomplete="current-password" />
                </div>

                <button type="submit" class="btn btn-neutral w-full mt-1">Sign in</button>
            </form>

            <p class="text-center text-sm text-base-content/50 mt-6">
                Don't have an account?
                <a class="link link-hover text-base-content font-semibold">Sign up</a>
            </p>

        </div>
    </div>
</div>
